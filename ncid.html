<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="https://halcekey.github.io/favicon.svg">
    <title>ISBN/NCID検索 (NDL+CiNii+OL)</title>
    <style>
        body { font-family: 'Noto Sans', sans-serif; max-width: 1000px; margin: 20px auto; padding: 0 20px; line-height: 1.6; }
        .input-area { background: #e0e0e0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input { padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #eee; white-space: nowrap; }
        .csv-area { margin-top: 30px; }
        textarea { width: 100%; height: 150px; font-family: monospace; }
        .top-button { position: fixed; top: 20px; right: 20px; padding: 10px 16px; background-color: #FF7b00; color: white; text-decoration: none; border-radius: 8px; font-size: 14px; z-index: 1000; }
        .top-button:hover {background-color: #b35600;}
        .info-button { position: fixed; top: 20px; right: 100px; padding: 11px 16px; background-color: #9facb7; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; z-index: 1000; }
        .info-button:hover {background-color: #9fb1be;}
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 8px; }
        .close { float: right; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

<h1>書籍検索</h1>

<div class="input-area">
    <input type="text" id="isbnInput" placeholder="ISBN または NCID" onkeydown="if(event.key==='Enter') addBook()">
    <button onclick="addBook()">追加</button>
    <p id="status" style="color: rgb(47, 50, 147); font-weight: bold;"></p>
</div>

<table id="bookTable">
    <thead>
        <tr>
            <th>ISBN</th>
            <th>NCID</th>
            <th>書籍名</th>
            <th>著者名</th>
            <th>出版社</th>
            <th>出版地</th>
            <th>出版年</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div class="csv-area">
    <h3>コピペ用CSV</h3>
    <textarea id="csvOutput" readonly></textarea>
</div>

<script>
const bookList = [];

async function addBook() {
    const inputField = document.getElementById('isbnInput');
    const rawInput = inputField.value.trim();
    const status = document.getElementById('status');

    if (!rawInput) return;

    const inputCleaned = rawInput.replace(/-/g, "");
    const isNCID = /^[A-Z]{2}\d{8,9}[0-9X]?$/.test(rawInput);
    const isISBN = /^\d{9}[\dX]$|^\d{13}$/.test(inputCleaned);

    status.textContent = "検索中...";

    try {
        const ndlUrl = isNCID
            ? `https://ndlsearch.ndl.go.jp/api/opensearch?any=${rawInput}`
            : `https://ndlsearch.ndl.go.jp/api/opensearch?isbn=${inputCleaned}`;

        const ndlRes = await fetch(ndlUrl);
        const ndlXml = new DOMParser().parseFromString(await ndlRes.text(), "text/xml");
        const item = ndlXml.querySelector('item');

        if (!item) {
            status.textContent = "NDLで書籍が見つかりませんでした";
            return;
        }

        let foundNCID = "";
        let tempISBN10 = "";
        let tempISBN13 = "";
        const identifiers = item.getElementsByTagName('dc:identifier');

        for (let id of identifiers) {
            const type = id.getAttribute("xsi:type") || "";
            const val = id.textContent.trim();
            const cleanId = val.replace(/-/g, "");

            if (type.includes("NIIBibID")) {
                foundNCID = cleanId;
            } else if (/^\d{13}$/.test(cleanId)) {
                tempISBN13 = cleanId;
            } else if (/^\d{9}[\dX]$/.test(cleanId)) {
                tempISBN10 = cleanId;
            }
        }

        const ndlFoundISBN = tempISBN13 || tempISBN10;
        let finalISBN = isISBN ? inputCleaned : (ndlFoundISBN || "不明");
        let finalNCID = isNCID ? rawInput : (foundNCID || "");

       if (!finalNCID && finalISBN !== "不明") {
            try {
                const ciniiUrl = `https://ci.nii.ac.jp/books/opensearch/search?isbn=${finalISBN}&appid=mOPA8iOPWzGfE1nfRaAn`;
                const ciniiRes = await fetch(ciniiUrl);
                const ciniiXml = new DOMParser().parseFromString(await ciniiRes.text(), "text/xml");
                
                const idTags = ciniiXml.getElementsByTagName('id');
                for (let tag of idTags) {
                    const textContent = tag.textContent.trim();
                    const ncidMatch = textContent.match(/\/ncid\/([A-Z]{2}\d{8,9}[0-9X]?)$/);
                    if (ncidMatch) {
                        finalNCID = ncidMatch[1];
                        break; 
                    }
                }
            } catch (e) {
                console.error("CiNii取得失敗:", e);
            }
        }
        
        if (!finalNCID) finalNCID = "不明";

        let place = "不明";
        if (finalISBN !== "不明") {
            try {
                const olUrl = `https://openlibrary.org/api/books?bibkeys=ISBN:${finalISBN}&format=json&jscmd=data`;
                const olRes = await fetch(olUrl);
                const olData = await olRes.json();
                const bookKey = `ISBN:${finalISBN}`;
                if (olData[bookKey]?.publish_places) {
                    place = olData[bookKey].publish_places.map(p => p.name).join(", ");
                }
            } catch (e) { console.error("OL取得失敗:", e); }
        }

        const book = {
            isbn: finalISBN,
            ncid: finalNCID,
            title: item.querySelector('title')?.textContent || "不明",
            author: item.getElementsByTagName('dc:creator')[0]?.textContent || "不明",
            publisher: item.getElementsByTagName('dc:publisher')[0]?.textContent || "不明",
            place: place,
            date: item.getElementsByTagName('dc:date')[0]?.textContent || "不明"
        };

        if (bookList.some(b => b.isbn === book.isbn && b.ncid === book.ncid)) {
            status.textContent = "追加済み";
            return;
        }

        bookList.push(book);
        updateTable();
        updateCSV();
        inputField.value = "";
        status.textContent = "";

    } catch (error) {
        status.textContent = "エラー";
        console.error(error);
    }
}

function updateTable() {
    const tbody = document.querySelector('#bookTable tbody');
    tbody.innerHTML = "";
    bookList.forEach(book => {
        const row = `<tr>
            <td>${book.isbn}</td>
            <td>${book.ncid}</td>
            <td>${book.title}</td>
            <td>${book.author}</td>
            <td>${book.publisher}</td>
            <td>${book.place}</td>
            <td>${book.date}</td>
        </tr>`;
        tbody.insertAdjacentHTML('beforeend', row);
    });
}

function updateCSV() {
    const header = "ISBN,NCID,書籍名,著者名,出版社,出版地,出版年\n";
    const rows = bookList.map(b =>
        `"${b.isbn}","${b.ncid}","${b.title}","${b.author}","${b.publisher}","${b.place}","${b.date}"`
    ).join("\n");
    document.getElementById('csvOutput').value = header + rows;
}

function toggleModal() {
    const modal = document.getElementById("licenseModal");
    modal.style.display = modal.style.display === "block" ? "none" : "block";
}

window.onclick = function(event) {
    const modal = document.getElementById("licenseModal");
    if (event.target === modal) modal.style.display = "none";
}
</script>

<a href="https://halcekey.github.io/isbntocsv/ol" class="top-button" target="_blank">OL版</a>
<button class="info-button" onclick="toggleModal()">ｉ</button>

<div id="licenseModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="toggleModal()">&times;</span>
        <h2>ライセンス・データ出典</h2>
        <p>本サイトは以下のAPIを組み合わせて利用しています：</p>
        <ul>
            <li><strong>国立国会図書館サーチ:</strong> 書誌詳細情報</li>
            <li><strong>CiNii Books:</strong> NCID (AppID取得済み)</li>
            <li><strong>Open Library:</strong> 出版地</li>
        </ul>
         <p>国立国会図書館サーチのライセンスは
            <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">
                <strong>CC BY 4.0（表示）</strong></a>です。</p>
    </div>
</div>

</body>
</html>
