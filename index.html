<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="https://halcekey.github.io/favicon.svg">
    <title>書籍情報検索</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
            background-color: #f7f8fa;
            color: #2d3139;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 540px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 36px;
            letter-spacing: 0.05em;
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-top-width: 5px;
            border-radius: 10px;
            padding: 28px 24px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
        }

        /* 元の3色を上辺のアクセントに適用 */
        .card-ndl { border-top-color: #8d8bf7; }
        .card-ol  { border-top-color: #f78c8b; }
        .card-ncid { border-top-color: #ebd052; }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title::after {
            content: "→";
            font-weight: 400;
            color: #9ca3af;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .card:hover .card-title::after {
            transform: translateX(4px);
            color: #2d3139;
        }

        .card-desc {
            font-size: 0.9rem;
            color: #5a606d;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>書籍情報検索</h1>

        <div class="card-grid">
            <a href="https://halcekey.github.io/isbntocsv/isbn" class="card card-ndl">
                <div>
                    <div class="card-title">NDL 軽量版</div>
                    <p class="card-desc">国立国会図書館のデータベースを使って検索する</p>
                </div>
            </a>

            <a href="https://halcekey.github.io/isbntocsv/ol" class="card card-ol">
                <div>
                    <div class="card-title">OL版</div>
                    <p class="card-desc">Open Libraryのデータベースを使って検索する（洋書向け）</p>
                </div>
            </a>

            <a href="https://halcekey.github.io/isbntocsv/ncid" class="card card-ncid">
                <div>
                    <div class="card-title">NCID対応版</div>
                    <p class="card-desc">NCIDでも検索する（ちょっと遅い）</p>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
