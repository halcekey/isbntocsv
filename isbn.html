<!DOCTYPE html>
<html lang="ja">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="https://halcekey.github.io/favicon.svg">
    <title>ISBN検索（NDL版）</title>
    <style>
        body { font-family: 'Noto Sans', sans-serif; max-width: 1000px; margin: 20px auto; padding: 0 20px; line-height: 1.6; }
        .input-area { background: #e0e0e0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input { padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #eee; white-space: nowrap; }
        .csv-area { margin-top: 30px; }
        textarea { width: 100%; height: 150px; font-family: monospace; }
        .top-button { position: fixed; top: 20px; right: 20px; padding: 10px 16px; background-color: #FF7b00; color: white; text-decoration: none; border-radius: 8px; font-size: 14px; z-index: 1000; }
        .top-button:hover {background-color: #b35600;}
        .info-button { position: fixed; top: 20px; right: 100px; padding: 11px 16px; background-color: #9facb7; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; z-index: 1000; }
        .info-button:hover {background-color: #9fb1be;}
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 8px; }
        .close { float: right; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>NDL ISBN検索</h1>
    
    <div class="input-area">
        <input type="text" id="isbnInput" placeholder="ISBN（半角・ハイフンなし）を入力" onkeydown="if(event.key==='Enter') addBook()">
        <button onclick="addBook()">追加</button>
        <p id="status" style="color: rgb(47, 50, 147);"></p>
    </div>

    <table id="bookTable">
        <thead>
            <tr>
                <th>ISBN</th>
                <th>書籍名</th>
                <th>著者名</th>
                <th>出版社</th>
                <th>出版年</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <div class="csv-area">
        <h3>コピペ用CSV</h3>
        <textarea id="csvOutput" readonly placeholder="データ入力後に表示"></textarea>
    </div>

    <script>
        const bookList = [];

        async function addBook() {
            const inputField = document.getElementById('isbnInput');
            const isbn = inputField.value.trim();
            const status = document.getElementById('status');
            
            if (!isbn) return;
            status.textContent = "検索中...";


            try {
                //ありがとう国立国会図書館！だいすき！
                const response = await fetch(`https://ndlsearch.ndl.go.jp/api/opensearch?isbn=${isbn}`);
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, "text/xml");
                const item = xml.querySelector('item');

                if (!item) {
                    status.textContent = "書籍 not found";
                    return;
                }

                const book = {
                    isbn: isbn,
                    title: item.querySelector('title')?.textContent || "不明",
                    author: item.getElementsByTagName('dc:creator')[0]?.textContent || "不明",
                    publisher: item.getElementsByTagName('dc:publisher')[0]?.textContent || "不明",
                    date: item.getElementsByTagName('dc:date')[0]?.textContent || "不明"
                };

                bookList.push(book);
                updateTable();
                updateCSV();
                
                inputField.value = "";
                status.textContent = "";
                inputField.focus();


            } catch (error) {
                status.textContent = "エラーかも";
                console.error(error);
            }
        }

        function updateTable() {
            const tbody = document.querySelector('#bookTable tbody');
            tbody.innerHTML = "";
            bookList.forEach(book => {
                const row = `<tr>
                    <td>${book.isbn}</td>
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>${book.publisher}</td>
                    <td>${book.date}</td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

    function updateCSV() {
        const header = "ISBN,書籍名,著者名,出版社,出版年\n";
        const rows = bookList.map(b => `"${b.isbn}","${b.title}","${b.author}","${b.publisher}","${b.date}"`).join("\n");
        document.getElementById('csvOutput').value = header + rows;
    }
    function toggleModal() {
        const modal = document.getElementById("licenseModal");
        modal.style.display = modal.style.display === "block" ? "none" : "block";
    }

    window.onclick = function(event) {
        const modal = document.getElementById("licenseModal");
        if (event.target === modal) {
            modal.style.display = "none";
        }
    }
</script>
    <a href="https://halcekey.github.io/isbntocsv/" class="top-button" target="_blank" rel="noopener noreferrer">home</a>
    <button class="info-button" onclick="toggleModal()">ｉ</button>
    <div id="licenseModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="toggleModal()">&times;</span>
                <h2>ライセンス情報</h2>
    <p>
        本サイトは国立国会図書館サーチのメタデータを利用しています。
    </p>
    <p>
      ライセンスは
      <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">
        <strong>CC BY 4.0（表示）</strong></a>です。
      
    </p>
    <p>
      出典：<a href="https://ndlsearch.ndl.go.jp/help/api" target="_blank" rel="noopener noreferrer">NDL Search API</a>
    </p>
  </div>
</div>
</body>
</html>
